<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">ACP Agent Control Plane</title>
  <desc id="d">Three stacked planes crossed by a single gate: every protected effect passes one decision point.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d3c1"/>
      <stop offset="1" stop-color="#2bb3e6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- planes: isometric rhombi, bottom to top -->
  <path d="M256 330 L412 386 L256 442 L100 386 Z" fill="#1f3354"/>
  <path d="M256 250 L412 306 L256 362 L100 306 Z" fill="#2c4a78"/>
  <path d="M256 170 L412 226 L256 282 L100 226 Z" fill="url(#top)"/>
  <!-- the gate: one decision line through every plane -->
  <rect x="244" y="92" width="24" height="330" rx="12" fill="#f5f7fb"/>
  <circle cx="256" cy="92" r="34" fill="#f5f7fb"/>
  <path d="M241 93 l11 11 l20 -22" fill="none" stroke="#0f1a2e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
